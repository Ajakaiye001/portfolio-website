<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEME — Your AI Creative Collaborator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cal-sans@5/index.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Animatable custom properties for shiny button ── */
    @property --gradient-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @property --gradient-angle-offset {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @property --gradient-percent {
      syntax: "<percentage>";
      initial-value: 5%;
      inherits: false;
    }
    @property --gradient-shine {
      syntax: "<color>";
      initial-value: white;
      inherits: false;
    }

    :root {
      --bg: #E9E4D6;
      --dot: #D0CAB8;
      --green: #1E3A0F;
      --lime: #C8F53C;
      --pink: #FF2D9B;
      --gray: #888880;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 48px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .logo-img {
      height: 38px;
      width: auto;
      display: block;
    }

    /* ── Shiny CTA button ── */
    .shiny-cta {
      --shiny-cta-bg:              #D91880;
      --shiny-cta-bg-subtle:       #A8106A;
      --shiny-cta-fg:              #ffffff;
      --shiny-cta-highlight:       rgba(255, 255, 255, 0.95);
      --shiny-cta-highlight-subtle:rgba(255, 210, 235, 0.85);
      --shiny-duration:            3s;
      --shiny-shadow-size:         2px;
      --shiny-transition:          800ms cubic-bezier(0.25, 1, 0.5, 1);

      isolation: isolate;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      outline-offset: 4px;
      padding: 14px 26px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.1px;
      line-height: 1.2;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--shiny-cta-fg);
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;

      background:
        linear-gradient(var(--shiny-cta-bg), var(--shiny-cta-bg)) padding-box,
        conic-gradient(
          from calc(var(--gradient-angle) - var(--gradient-angle-offset)),
          transparent,
          var(--shiny-cta-highlight)        var(--gradient-percent),
          var(--gradient-shine)             calc(var(--gradient-percent) * 2),
          var(--shiny-cta-highlight)        calc(var(--gradient-percent) * 3),
          transparent                       calc(var(--gradient-percent) * 4)
        ) border-box;

      box-shadow: inset 0 0 0 1px var(--shiny-cta-bg-subtle);
      transition: var(--shiny-transition);
      transition-property: --gradient-angle-offset, --gradient-percent, --gradient-shine;

      animation:
        gradient-angle linear infinite var(--shiny-duration),
        gradient-angle linear infinite calc(var(--shiny-duration) / 0.4) reverse paused;
      animation-composition: add;
    }

    .shiny-cta::before,
    .shiny-cta::after,
    .shiny-cta span::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset-inline-start: 50%;
      inset-block-start: 50%;
      translate: -50% -50%;
      z-index: -1;
    }

    .shiny-cta:active { translate: 0 1px; }

    /* Rotating dots mask */
    .shiny-cta::before {
      --size:     calc(100% - var(--shiny-shadow-size) * 3);
      --position: 2px;
      --space:    calc(var(--position) * 2);
      width: var(--size);
      height: var(--size);
      background: radial-gradient(
        circle at var(--position) var(--position),
        white calc(var(--position) / 4),
        transparent 0
      ) padding-box;
      background-size: var(--space) var(--space);
      background-repeat: space;
      mask-image: conic-gradient(
        from calc(var(--gradient-angle) + 45deg),
        black,
        transparent 10% 90%,
        black
      );
      border-radius: inherit;
      opacity: 0.4;
      z-index: -1;
      animation:
        gradient-angle linear infinite var(--shiny-duration),
        gradient-angle linear infinite calc(var(--shiny-duration) / 0.4) reverse paused;
      animation-composition: add;
    }

    /* Inner shimmer sweep */
    .shiny-cta::after {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(-50deg, transparent, rgba(255,255,255,0.55), transparent);
      mask-image: radial-gradient(circle at bottom, transparent 40%, black);
      opacity: 0.6;
      animation:
        shimmer-btn linear infinite var(--shiny-duration),
        shimmer-btn linear infinite calc(var(--shiny-duration) / 0.4) reverse paused;
      animation-composition: add;
    }

    .shiny-cta span { z-index: 1; position: relative; }

    .shiny-cta span::before {
      --size: calc(100% + 1rem);
      width: var(--size);
      height: var(--size);
      box-shadow: inset 0 -1ex 2rem 4px rgba(255, 255, 255, 0.45);
      opacity: 0;
      transition: opacity var(--shiny-transition);
      animation: breathe-btn calc(var(--shiny-duration) * 1.5) linear infinite;
    }

    /* On hover — run all animations + expand the sweep */
    .shiny-cta:is(:hover, :focus-visible) {
      --gradient-percent:       20%;
      --gradient-angle-offset:  95deg;
      --gradient-shine:         var(--shiny-cta-highlight-subtle);
    }
    .shiny-cta:is(:hover, :focus-visible),
    .shiny-cta:is(:hover, :focus-visible)::before,
    .shiny-cta:is(:hover, :focus-visible)::after {
      animation-play-state: running;
    }
    .shiny-cta:is(:hover, :focus-visible) span::before { opacity: 1; }

    @keyframes gradient-angle  { to { --gradient-angle: 360deg; } }
    @keyframes shimmer-btn     { to { rotate: 360deg; } }
    @keyframes breathe-btn     {
      from, to { scale: 1;   }
      50%      { scale: 1.2; }
    }

    .shiny-cta.btn-cta-mobile { display: none; }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 48px 24px 0;
      max-width: 820px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Cal Sans', sans-serif;
      font-size: 60px;
      font-weight: 400;
      line-height: 1;
      color: var(--green);
      letter-spacing: -0.02em;
    }

    .highlight {
      background: var(--lime);
      border-radius: 6px;
      padding: 0 8px 2px;
      display: inline;
    }

    .hero p {
      margin: 18px auto 0;
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
      color: var(--gray);
      line-height: 1.6;
      max-width: 420px;
    }

    /* ── CARDS STAGE ── */
    .cards-stage {
      position: relative;
      width: 100%;
      height: 420px;
      margin: 16px auto 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .card-wrap {
      position: absolute;
      bottom: 0;
      transform-origin: bottom center;
      filter: drop-shadow(0 16px 40px rgba(0,0,0,0.22));
    }

    .card-wrap img {
      display: block;
      width: 210px;
      height: auto;
    }

    /* Fan transforms — desktop */
    .card-wrap-1 { transform: translateX(-265px) rotate(-22deg) translateY(10px); z-index: 1; }
    .card-wrap-2 { transform: translateX(-130px) rotate(-11deg) translateY(4px);  z-index: 2; }
    .card-wrap-3 { transform: translateX(   0px) rotate(  1deg) translateY(0px);  z-index: 3; }
    .card-wrap-4 { transform: translateX( 130px) rotate( 11deg) translateY(4px);  z-index: 4; }
    .card-wrap-5 { transform: translateX( 268px) rotate( 21deg) translateY(10px); z-index: 5; overflow: visible; }

    /* mascot on the draw-4 card */
    .mascot-wrap {
      position: absolute;
      top: -52px;
      right: -18px;
      z-index: 10;
      pointer-events: none;
    }
    .mascot-wrap img { width: 80px; height: auto; display: block; }

    /* ── LOGOS ── */
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 58px 24px 72px;
      flex-wrap: wrap;
    }

    .logo-item {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #8A8A82;
      font-weight: 700;
      font-size: 1.15rem;
      opacity: 0.75;
    }

    .logo-item svg { flex-shrink: 0; transform: scale(1.25); transform-origin: center; }

    /* ═══════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════ */

    :root {
      --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-quart: cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Keyframes */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Per-card entrance — slides up along each card's tilt axis */
    @keyframes cardIn-1 {
      from { opacity: 0; transform: translateX(-265px) rotate(-22deg) translateY(90px); }
      to   { opacity: 1; transform: translateX(-265px) rotate(-22deg) translateY(10px); }
    }
    @keyframes cardIn-2 {
      from { opacity: 0; transform: translateX(-130px) rotate(-11deg) translateY(84px); }
      to   { opacity: 1; transform: translateX(-130px) rotate(-11deg) translateY(4px); }
    }
    @keyframes cardIn-3 {
      from { opacity: 0; transform: translateX(0px) rotate(1deg) translateY(80px); }
      to   { opacity: 1; transform: translateX(0px) rotate(1deg) translateY(0px); }
    }
    @keyframes cardIn-4 {
      from { opacity: 0; transform: translateX(130px) rotate(11deg) translateY(84px); }
      to   { opacity: 1; transform: translateX(130px) rotate(11deg) translateY(4px); }
    }
    @keyframes cardIn-5 {
      from { opacity: 0; transform: translateX(268px) rotate(21deg) translateY(90px); }
      to   { opacity: 1; transform: translateX(268px) rotate(21deg) translateY(10px); }
    }
    @keyframes cardIn-mobile {
      from { opacity: 0; transform: translateY(60px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mascot continuous float */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-9px); }
    }


    /* ── Apply entrance animations ── */
    nav {
      animation: fadeInDown 600ms var(--ease-expo) both;
    }
    .hero h1 {
      animation: fadeInUp 700ms var(--ease-expo) both;
      animation-delay: 120ms;
    }
    .hero p {
      animation: fadeInUp 600ms var(--ease-expo) both;
      animation-delay: 280ms;
    }
    .card-wrap-1 { animation: cardIn-1 680ms var(--ease-expo) both; animation-delay: 440ms; }
    .card-wrap-2 { animation: cardIn-2 680ms var(--ease-expo) both; animation-delay: 530ms; }
    .card-wrap-3 { animation: cardIn-3 680ms var(--ease-expo) both; animation-delay: 620ms; }
    .card-wrap-4 { animation: cardIn-4 680ms var(--ease-expo) both; animation-delay: 710ms; }
    .card-wrap-5 { animation: cardIn-5 680ms var(--ease-expo) both; animation-delay: 800ms; }
    .logos {
      animation: fadeInUp 500ms var(--ease-expo) both;
      animation-delay: 960ms;
    }

    /* ── Mascot float (starts after page loads) ── */
    .mascot-wrap img {
      animation: float 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      animation-delay: 1.8s;
    }

    /* ── CTA entrance animation ── */
    .shiny-cta {
      animation-delay: 0ms; /* entrance handled by nav parent */
    }

    /* ── Card hover lift (desktop) ── */
    .card-wrap {
      transition: filter 0.25s var(--ease-quart);
      cursor: pointer;
    }
    .card-wrap:hover {
      filter: drop-shadow(0 24px 56px rgba(0,0,0,0.32)) brightness(1.04);
    }

    /* ── Magnet inner wrapper ── */
    .card-magnet {
      will-change: transform;
      display: block;
    }

    /* ── Reduced motion — respect accessibility ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── MOBILE ── */
    @media (max-width: 680px) {
      nav { padding: 16px 20px; }

      .shiny-cta.btn-cta-desktop { display: none; }
      .shiny-cta.btn-cta-mobile  {
        display: inline-block;
        padding: 11px 20px;
        font-size: 0.8rem;
        letter-spacing: 0.8px;
      }

      .hero { padding: 32px 20px 0; }

      .cards-stage {
        height: 360px;
        margin-top: 72px;
      }

      /* hide fanned cards, show only draw-4 */
      .card-wrap-1,
      .card-wrap-2,
      .card-wrap-3,
      .card-wrap-4 { display: none; }

      .card-wrap-5 {
        transform: none;
        position: relative;
        bottom: auto;
        animation: cardIn-mobile 680ms var(--ease-expo) both;
        animation-delay: 500ms;
      }

      .card-wrap-5 img { width: 78vw; max-width: 310px; }

      .mascot-wrap { right: -14px; top: -48px; }
      .mascot-wrap img { width: 72px; }

      .logos { gap: 28px; padding: 48px 24px 60px; }
      .logo-item { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="#">
      <img class="logo-img" src="assets/Logo.svg" alt="WEME" />
    </a>

    <a href="#" class="shiny-cta btn-cta-desktop"><span>Book Your Free Intro Call</span></a>
    <a href="#" class="shiny-cta btn-cta-mobile"><span>MENU</span></a>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>
      Give Your ideas a glow up.<br>
      Meet your new AI creative<br>
      <span class="highlight">collaborator.</span>
    </h1>
    <p>Capture, organize, and elevate your ideas across work, life and leisure</p>
  </section>

  <!-- CARDS -->
  <div class="cards-stage">

    <div class="card-wrap card-wrap-1">
      <div class="card-magnet">
        <img src="assets/5 cards/Green.svg" alt="Green card" />
      </div>
    </div>

    <div class="card-wrap card-wrap-2">
      <div class="card-magnet">
        <img src="assets/5 cards/Red.svg" alt="Red card" />
      </div>
    </div>

    <div class="card-wrap card-wrap-3">
      <div class="card-magnet">
        <img src="assets/5 cards/Yellow.svg" alt="Yellow card" />
      </div>
    </div>

    <div class="card-wrap card-wrap-4">
      <div class="card-magnet">
        <img src="assets/5 cards/Blue.svg" alt="Blue card" />
      </div>
    </div>

    <div class="card-wrap card-wrap-5">
      <!-- Mascot sits directly on card-wrap-5, outside the magnet layer -->
      <div class="mascot-wrap">
        <img src="assets/cute-sticker-of-a-smiling-cloud-shape-with-a-happy 3.svg" alt="mascot" />
      </div>
      <div class="card-magnet">
        <img src="assets/5 cards/draw4.svg" alt="Draw 4 card" />
      </div>
    </div>

  </div>

  <!-- PARTNER LOGOS -->
  <div class="logos">

    <div class="logo-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
      </svg>
      GitHub
    </div>

    <div class="logo-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L2 19.5h20L12 2z"/>
      </svg>
      Vercel
    </div>

    <div class="logo-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="2" width="20" height="20" rx="4"/>
        <path d="M7 10v7M7 7v.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 17v-3.5a2 2 0 014 0V17M11 10v7" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Linked<strong>in</strong>
    </div>

    <div class="logo-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="18" rx="3"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
      </svg>
      Cal.com
    </div>

  </div>

  <script>
    (function () {
      const PADDING        = 100;
      const MAGNET_STRENGTH = 2;
      const ACTIVE_TR      = 'transform 0.3s ease-out';
      const INACTIVE_TR    = 'transform 0.5s ease-in-out';

      const magnets = Array.from(document.querySelectorAll('.card-magnet'));

      function isMobile() { return window.innerWidth <= 680; }

      /* Track active state per magnet to avoid redundant style writes */
      const state = new Map(magnets.map(m => [m, false]));

      window.addEventListener('mousemove', (e) => {
        if (isMobile()) return;

        magnets.forEach(inner => {
          /* Use the outer card-wrap for position/size — it reflects the
             actual screen bounding box of the rotated card */
          const wrap = inner.closest('.card-wrap');
          const { left, top, width, height } = wrap.getBoundingClientRect();

          const centerX = left + width / 2;
          const centerY = top  + height / 2;

          const distX = Math.abs(centerX - e.clientX);
          const distY = Math.abs(centerY - e.clientY);

          if (distX < width / 2 + PADDING && distY < height / 2 + PADDING) {
            const offsetX = (e.clientX - centerX) / MAGNET_STRENGTH;
            const offsetY = (e.clientY - centerY) / MAGNET_STRENGTH;

            inner.style.transition = ACTIVE_TR;
            inner.style.transform  = `translate3d(${offsetX}px, ${offsetY}px, 0)`;
            state.set(inner, true);
          } else if (state.get(inner)) {
            inner.style.transition = INACTIVE_TR;
            inner.style.transform  = 'translate3d(0, 0, 0)';
            state.set(inner, false);
          }
        });
      });
    })();
  </script>
</body>
</html>
